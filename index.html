<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c100e">
<title>Cardápio Woodstock Rock Bar</title>
<meta name="description" content="Cardápio do Woodstock Rock Bar — Avenida D, 1064, Setor Oeste, Goiânia.">
<style>
  /* Single dark look matching the printed menu: sticky bar + pages stacked at full width */
  :root { --bg: #120b0a; --bar: #1c100e; --line: #3a1d1a; --fg: #f3e7d6; --muted: #c9b7a3; --accent: #d71920; color-scheme: dark; }
  body { margin: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bar); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn { flex-shrink: 0; color: #fff; background: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 6px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
  header h1 span { color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding-block: 12px 32px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  #pages { display: flex; flex-direction: column; gap: 12px; }
  canvas { display: block; width: 100%; max-width: 100%; height: auto; background: #000; box-shadow: 0 2px 14px rgba(0,0,0,.6); }
  #status { text-align: center; padding: 48px 16px; font-size: 15px; line-height: 1.5; color: var(--muted); }
</style>
</head>
<body>
<header><h1>Cardápio · <span>Woodstock Rock Bar</span></h1><a class="btn" href="cardapio-woodstock-rock-bar.pdf?v=20261023">Abrir PDF</a></header>
<main>
  <div id="status">Carregando o cardápio…</div>
  <div id="pages"></div>
</main>
<script src="pdf.min.js"></script>
<script>
(function () {
  var PDF_URL = "cardapio-woodstock-rock-bar.pdf?v=20261023";
  var status = document.getElementById("status");
  var container = document.getElementById("pages");
  function fail() { status.hidden = false; status.textContent = "Não foi possível carregar o cardápio. Verifique sua conexão e recarregue a página."; }
  if (!window.pdfjsLib) { fail(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  var pdfDoc = null, lastWidth = 0;
  function render() {
    var width = container.clientWidth;
    if (!pdfDoc || !width || width === lastWidth) return;
    lastWidth = width;
    container.innerHTML = "";
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var chain = Promise.resolve();
    for (var i = 1; i <= pdfDoc.numPages; i++) {
      (function (n) {
        var canvas = document.createElement("canvas");
        canvas.setAttribute("role", "img");
        canvas.setAttribute("aria-label", "Página " + n + " de " + pdfDoc.numPages + " do cardápio");
        container.appendChild(canvas);
        chain = chain.then(function () { return pdfDoc.getPage(n); }).then(function (page) {
          var base = page.getViewport({ scale: 1 });
          var vp = page.getViewport({ scale: (width / base.width) * dpr });
          canvas.width = Math.floor(vp.width);
          canvas.height = Math.floor(vp.height);
          return page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        });
      })(i);
    }
    chain.catch(fail);
  }
  pdfjsLib.getDocument(PDF_URL).promise.then(function (doc) {
    pdfDoc = doc;
    status.hidden = true;
    render();
    var t;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(render, 250); });
  }).catch(fail);
})();
</script>
</body>
</html>
